name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # stdlib.types must come from the same liquidsoap commit as the libraries the
  # analysis module is built against.
  LIQUIDSOAP_REF: cb5959873c80790d531c90605f90fe18e9542966
  OPAM_REPOSITORY_REF: 8cdfa3296d9bc7d93273f46eb2438757e4fd5cf0
  TREE_SITTER_LIQUIDSOAP_REF: a094345ace46277b23dbcb81a5d8cd972df32183
  BINARYEN_VERSION: "126"
  TREE_SITTER_CLI_VERSION: 0.26.11

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: savonet/liquidsoap
          ref: ${{ env.LIQUIDSOAP_REF }}
          path: _deps/liquidsoap

      - uses: actions/checkout@v4
        with:
          repository: savonet/tree-sitter-liquidsoap
          ref: ${{ env.TREE_SITTER_LIQUIDSOAP_REF }}
          path: _deps/tree-sitter-liquidsoap

      - name: Install binaryen and the tree-sitter CLI
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
          npm install -g "tree-sitter-cli@${TREE_SITTER_CLI_VERSION}"

      # The stdlib the server ships is the one liquidsoap compiles, so the
      # ffmpeg operators only show up if liquidsoap is built against ffmpeg.
      - name: Install the static ffmpeg build
        run: |
          curl -fsSL https://liquidsoap.info/ffmpeg-static-build/key.asc |
            sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/liquidsoap-ffmpeg.gpg
          echo "deb https://liquidsoap.info/ffmpeg-static-build stable main" |
            sudo tee /etc/apt/sources.list.d/liquidsoap-ffmpeg.list
          sudo apt-get update
          sudo apt-get install -y ffmpeg-liquidsoap libbz2-dev
          # /usr/local/lib/pkgconfig is on pkg-config's default search path, so
          # the .pc files the build bundles for everything it links would also
          # switch on liquidsoap's srt, xiph and mp3 modules.
          sudo find /usr/local/lib/pkgconfig -name '*.pc' \
            ! -name 'libav*.pc' ! -name 'libsw*.pc' -delete
          # Same wrapper liquidsoap's own CI image uses: the bundled assembly
          # relocates against globally-visible symbols, which ld rejects when
          # making the shared stub libraries dune builds alongside the static
          # ones.
          sudo mv /usr/bin/ld /usr/bin/ld.real
          printf '#!/bin/sh\nfor a; do [ "$a" = "-shared" ] && exec /usr/bin/ld.real -Bsymbolic "$@"; done\nexec /usr/bin/ld.real "$@"\n' |
            sudo tee /usr/bin/ld
          sudo chmod +x /usr/bin/ld

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          opam-repositories: |
            default: git+https://github.com/ocaml/opam-repository.git#${{ env.OPAM_REPOSITORY_REF }}

      # Liquidsoap builds its synced modules from its own tree, so a switch whose
      # opam copies are older than the checkout still builds it.
      - name: Locate the opam switch
        id: switch
        run: echo "prefix=$(opam var prefix)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.switch.outputs.prefix }}
          key: opam-switch-${{ runner.os }}-${{ env.OPAM_REPOSITORY_REF }}-${{ hashFiles('_deps/liquidsoap/opam/*.opam', '_deps/liquidsoap/src/modules/synced/**/*.opam') }}

      # The synced modules are liquidsoap's own copies, so they are pinned. Only
      # the required dependencies are installed, and binaryen comes from its
      # release since apt's is too old.
      - name: Install OCaml dependencies
        run: |
          for module in _deps/liquidsoap/src/modules/synced/*/; do
            opam pin add -yn "$module"
          done
          opam install -y --deps-only ./_deps/liquidsoap/opam/liquidsoap.opam ./_deps/liquidsoap/opam/liquidsoap-lang.opam ./_deps/liquidsoap/opam/liquidsoap-js.opam
          opam install -y --assume-depexts wasm_of_ocaml-compiler
          opam install -y --no-depexts conf-ffmpeg dune-configurator

      - name: Build liquidsoap
        working-directory: _deps/liquidsoap
        run: |
          opam exec -- dune build @install src/js/stdlib.types
          _build/default/src/bin/liquidsoap.exe --stdlib ./src/libs/stdlib.liq --list-functions-json > functions.json
          grep -q '"ffmpeg.encode.audio"' functions.json ||
            { echo "liquidsoap was built without ffmpeg support" >&2; exit 1; }

      - name: Build the analysis module
        working-directory: analysis
        run: opam exec -- dune build --profile release ./analysis_wasm.bc.wasm.js
        env:
          OCAMLPATH: ${{ github.workspace }}/_deps/liquidsoap/_build/install/default/lib

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter liquidsoap-patcher run build:grammar
        env:
          TREE_SITTER_LIQUIDSOAP: ${{ github.workspace }}/_deps/tree-sitter-liquidsoap

      - run: pnpm run build
        env:
          LIQUIDSOAP_STDLIB_TYPES: ${{ github.workspace }}/_deps/liquidsoap/_build/default/src/js/stdlib.types
          LIQUIDSOAP_FUNCTIONS_JSON: ${{ github.workspace }}/_deps/liquidsoap/functions.json

      - run: pnpm test

      # Each push to main replaces the tarball users install from, until the
      # server is published on npm.
      - name: Pack the server
        if: github.event_name == 'push'
        run: |
          node scripts/pack.mjs "0.0.0-main.$(git rev-parse --short HEAD)" "$RUNNER_TEMP/pack"
          mv "$RUNNER_TEMP"/pack/*.tgz "$RUNNER_TEMP/liquidsoap-language-server.tgz"

      - name: Publish the build from main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view main-build > /dev/null 2>&1 ||
            gh release create main-build --prerelease --title "Latest build from main" \
              --notes "The server built from the latest commit on main. See the README to install it."
          gh release upload main-build "$RUNNER_TEMP/liquidsoap-language-server.tgz" --clobber
